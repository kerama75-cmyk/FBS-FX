 var a=assets[ai]; var p=a.price;
 for(var i=0;i<24;i++){
  var o=p;
  var step=a.name==='GOLD'?3:0.001;
  var c=o+(Math.random()-0.5)*step;
  var h=Math.max(o,c)+Math.random()*step*0.5;
  var l=Math.min(o,c)-Math.random()*step*0.5;
  a.candles.push({o:o,h:h,l:l,c:c}); p=c;
 }
 a.price=p;
}

function drawCandles(id, candles){
 var c=document.getElementById(id); if(!c) return;
 var ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
 if(!candles.length) return;
 var min=999999, max=-999999;
 for(var i=0;i<candles.length;i++){ if(candles[i].h>max) max=candles[i].h; if(candles[i].l<min) min=candles[i].l; }
 var range=(max-min)||1;
 var w=c.width/candles.length;
 for(var j=0;j<candles.length;j++){
  var k=candles[j]; var x=j*w+w/2;
  var up=k.c>=k.o; var col=up?'#00d084':'#ff3b3b';
  var yH=c.height-((k.h-min)/range)*c.height;
  var yL=c.height-((k.l-min)/range)*c.height;
  var yO=c.height-((k.o-min)/range)*c.height;
  var yC=c.height-((k.c-min)/range)*c.height;
  ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.stroke();
  ctx.fillStyle=col;
  var top=Math.min(yO,yC); var hh=Math.max(2,Math.abs(yC-yO));
  ctx.fillRect(x-w*0.35, top, w*0.7, hh);
 }
}

function tfBar(){

  var cls=tfs[i]===timeframe?'active':'';

 }
 return html+'</div>';
}
