<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBS FX</title>
<style>
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px;padding-bottom:80px}
h1{color:#00d084;margin:0}
.card{background:#141b32;padding:16px;border-radius:12px;margin:10px 0}
.row{display:flex;gap:10px}
.buy{flex:1;background:#00d084;color:#000;border:0;padding:18px;border-radius:10px;font-weight:bold;font-size:19px}
.sell{flex:1;background:#ff3b3b;color:#fff;border:0;padding:18px;border-radius:10px;font-weight:bold;font-size:19px}
.small{color:#aaa;font-size:13px}
.big{font-size:32px;font-weight:bold}
.up{color:#00d084}.down{color:#ff3b3b}
.back{background:#222;border:0;color:#fff;padding:10px 16px;border-radius:8px}
canvas{width:100%;background:#0a0f1e;border-radius:8px}
.tf{display:flex;gap:6px;margin:10px 0}
.tf button{flex:1;padding:10px 0;border:0;border-radius:8px;background:#1e2745;color:#aaa;font-weight:bold}
.tf button.active{background:#00d084;color:#000}
input{width:100%;padding:12px;border-radius:8px;border:0;margin:6px 0;font-size:16px;background:#1e2745;color:#fff;box-sizing:border-box}
label{font-size:13px;color:#aaa}
.trade{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #333;padding:10px 0;flex-wrap:wrap}
.trade-info{flex:1;min-width:140px}
.closebtn{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:6px;font-weight:bold;white-space:nowrap}
.pnl-box{background:#1e2745;padding:12px;border-radius:8px;margin-top:10px;display:flex;justify-content:space-between}
.hist{border-top:1px solid #333;padding:8px 0;font-size:14px}
.badge{font-size:11px;padding:3px 7px;border-radius:5px;font-weight:bold}
.badge-tp{background:#00d084;color:#000}.badge-sl{background:#ff3b3b;color:#fff}.badge-manual{background:#444;color:#fff}
.tab{display:flex;gap:6px;margin-bottom:10px}
.tab button{flex:1;padding:10px;border:0;border-radius:8px;background:#1e2745;color:#aaa;font-weight:bold}
.tab button.active{background:#fff;color:#000}
</style>
</head>
<body>
<div id="app">
<h1>FBS FX</h1>
<p>Live Forex - Candlesticks</p>
<div class="card"><b>Demo Balance: $<span id="bal">10000.00</span></b><br><span class="small" id="pnl">Floating P/L: $0.00</span><br><span class="small" id="todayPnl">Today Profit: $0.00</span></div>
<div id="list"></div>
<div class="card"><div class="tab"><button id="tabOpen" class="active" onclick="showTab('open')">Open Trades</button><button id="tabHist" onclick="showTab('hist')">History</button></div><div id="trades">No open trades yet</div></div>
</div>
<div id="err" style="color:#ff3b3b"></div>
<script>
try{
var assets=[
{name:'EUR/USD',price:1.0850,open:1.0850,candles:[]},
{name:'GBP/USD',price:1.2700,open:1.2700,candles:[]},
{name:'USD/JPY',price:151.20,open:151.20,candles:[]},
{name:'GOLD',price:2350,open:2350,candles:[]},
{name:'BTC/USD',price:65000,open:65000,candles:[]},
{name:'USD/KES',price:130.50,open:130.50,candles:[]},
{name:'GBP/JPY',price:192.50,open:192.50,candles:[]},
{name:'AUD/USD',price:0.6500,open:0.6500,candles:[]},
{name:'USD/CHF',price:0.8800,open:0.8800,candles:[]}
];
var selected=null, balance=10000, trades=[], history=[], lot=0.01, timeframe='1M', tickCount=0, currentTab='open';
var tfTicks={'1M':2,'5M':5,'15M':10,'1H':20,'1D':40};
for(var ai=0;ai<assets.length;ai++){ var a=assets[ai]; var p=a.price; for(var i=0;i<24;i++){ var o=p; var st=Math.abs(p)*0.002; var c=o+(Math.random()-0.5)*st; var h=Math.max(o,c)+Math.random()*st*0.5; var l=Math.min(o,c)-Math.random()*st*0.5; a.candles.push({o:o,h:h,l:l,c:c}); p=c; } a.price=p; }

function getAsset(n){ for(var i=0;i<assets.length;i++) if(assets[i].name===n) return assets[i]; return null; }
function mult(name){ if(name==='GOLD') return 1; if(name==='BTC/USD') return 0.1; if(name==='USD/KES') return 0.5; if(name.indexOf('JPY')>=0) return 10; return 100; }
function fmt(name,price){ if(name==='BTC/USD') return price.toFixed(0); if(name==='USD/KES'||name==='USD/JPY'||name==='GBP/JPY') return price.toFixed(2); if(name==='GOLD') return price.toFixed(2); return price.toFixed(4); }
function calcProfit(t){ var a=getAsset(t.name); var d=t.type==='BUY'?a.price-t.entry:t.entry-a.price; return d*mult(t.name)*t.lot*100; }
function totalPnl(){ var s=0; for(var i=0;i<trades.length;i++) s+=calcProfit(trades[i]); return s; }
function pairPnl(name){ var s=0; for(var i=0;i<trades.length;i++) if(trades[i].name===name) s+=calcProfit(trades[i]); return s; }
function todayProfit(){ var s=0; for(var i=0;i<history.length;i++) s+=history[i].profit; return s; }

function draw(id, candles){
 var cv=document.getElementById(id); if(!cv) return;
 var ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
 if(!candles.length) return;
 var mn=1e12, mx=-1e12;
 for(var i=0;i<candles.length;i++){ if(candles[i].h>mx) mx=candles[i].h; if(candles[i].l<mn) mn=candles[i].l; }
 var rg=(mx-mn)||1; var w=cv.width/candles.length;
 for(var j=0;j<candles.length;j++){ var k=candles[j]; var x=j*w+w/2; var col=k.c>=k.o?'#00d084':'#ff3b3b';
  var yH=cv.height-((k.h-mn)/rg)*cv.height; var yL=cv.height-((k.l-mn)/rg)*cv.height;
  var yO=cv.height-((k.o-mn)/rg)*cv.height; var yC=cv.height-((k.c-mn)/rg)*cv.height;
  ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.stroke();
  ctx.fillStyle=col; var top=Math.min(yO,yC); var hh=Math.max(2,Math.abs(yC-yO)); ctx.fillRect(x-w*0.35,top,w*0.7,hh); }
}
function tradeRow(t,i){
 var p=calcProfit(t); var col=p>=0?'#00d084':'#ff3b3b';
 var extra='';
 if(t.tp) extra+='<br><span class="small">TP: $'+fmt(t.name,t.tp)+'</span>';
 if(t.sl) extra+='<br><span class="small">SL: $'+fmt(t.name,t.sl)+'</span>';
 return '<div class="trade"><div class="trade-info"><b>'+t.type+' '+t.name+' '+t.lot+' lot</b><br><span class="small">@ $'+fmt(t.name,t.entry)+' &nbsp; <span style="color:'+col+'">'+(p>=0?'+':'')+'$'+p.toFixed(2)+'</span></span>'+extra+'</div><button class="closebtn" onclick="closeTrade('+i+')">Close</button></div>';
}
function histRow(h){
 var col=h.profit>=0?'#00d084':'#ff3
