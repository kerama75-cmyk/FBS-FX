<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBS FX</title>
<style>
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
h1{color:#00d084;margin:0}
.card{background:#141b32;padding:16px;border-radius:12px;margin:10px 0}
.row{display:flex;gap:10px}
.buy{flex:1;background:#00d084;color:#000;border:0;padding:16px;border-radius:10px;font-weight:bold;font-size:18px}
.sell{flex:1;background:#ff3b3b;color:#fff;border:0;padding:16px;border-radius:10px;font-weight:bold;font-size:18px}
.small{color:#aaa;font-size:13px}
button{cursor:pointer}
</style>
</head>
<body>
<h1>FBS FX</h1>
<p>Live Forex Prices</p>
<div class="card"><b>Demo Balance: $<span id="balance">10000.00</span></b><br><span class="small" id="pnl">Floating P/L: $0.00</span><br><span class="small" id="status">Connecting...</span></div>
<div id="coinList"></div>
<div class="card"><h2 id="price">Select a pair</h2><canvas id="chart" height="120"></canvas></div>
<div class="row">
<button class="buy" onclick="openTrade('BUY')">BUY</button>
<button class="sell" onclick="openTrade('SELL')">SELL</button>
</div>
<div class="card"><h3>Open Trades</h3><div id="trades">No open trades yet</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let assets=[
{symbol:'frxEURUSD',name:'EUR/USD',price:0,history:[]},
{symbol:'frxGBPUSD',name:'GBP/USD',price:0,history:[]},
{symbol:'frxUSDJPY',name:'USD/JPY',price:0,history:[]},
{symbol:'frxXAUUSD',name:'GOLD',price:0,history:[]}
];
let selected=assets[0], chart=null, balance=10000, trades=[];
function render(){
 document.getElementById('coinList').innerHTML=assets.map(a=>'<div class="card" onclick="selectCoin(\''+a.symbol+'\')"><b>'+a.name+'</b> - '+(a.price?'$'+a.price.toFixed(2):'Loading...')+'</div>').join('');
 document.getElementById('price').innerText=selected.name+' : '+(selected.price?'$'+selected.price.toFixed(2):'Loading...');
 document.getElementById('balance').innerText=balance.toFixed(2);
 let pnl=0;
 trades.forEach(t=>{let a=assets.find(x=>x.symbol===t.symbol); if(a&&a.price){let d=t.type==='BUY'?a.price-t.entry:t.entry-a.price; pnl+=d*100;}});
 document.getElementById('pnl').innerText='Floating P/L: $'+pnl.toFixed(2);
 document.getElementById('trades').innerHTML=trades.length?trades.map((t,i)=>'<div style="border-top:1px solid #333;padding:8px 0"><b>'+t.type+' '+t.name+'</b> @ $'+t.entry.toFixed(2)+' <button onclick="closeTrade('+i+')" style="float:right">Close</button></div>').join(''):'No open trades yet';
 if(chart) chart.destroy();
 chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:selected.history.map((_,i)=>i),datasets:[{data:selected.history,borderColor:'#00d084',tension:0.3,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false}}}});
}
function selectCoin(s){selected=assets.find(a=>a.symbol===s);render();}
function openTrade(type){
 if(!selected.price){alert('Wait for price to load');return;}
 trades.push({type:type,symbol:selected.symbol,name:selected.name,entry:selected.price});
 render();
}
function closeTrade(i){
 let t=trades[i]; let a=assets.find(x=>x.symbol===t.symbol); let cur=a.price;
 let profit=(t.type==='BUY'?cur-t.entry:t.entry-cur)*100;
 balance+=profit; trades.splice(i,1); render();
}
function connect(){
 let ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{document.getElementById('status').innerText='Connected - Live'; assets.forEach(a=>ws.send(JSON.stringify({ticks:a.symbol,subscribe:1})));};
 ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.tick){let a=assets.find(x=>x.symbol===d.tick.symbol); if(a){a.price=parseFloat(d.tick.quote); a.history.push(a.price); if(a.history.length>30) a.history.shift(); render();}}};
 ws.onerror=()=>{document.getElementById('status').innerText='Connection error - reload page';};
}
render(); connect();
</script>
</body>
</html>
